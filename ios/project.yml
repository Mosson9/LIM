# XcodeGen spec — generates LIM.xcodeproj.
#   brew install xcodegen
#   cd ios && xcodegen generate && open LIM.xcodeproj
name: LIM
options:
  bundleIdPrefix: app.lim
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_LANGUAGE: zh-Hans
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LIM:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/zh-Hans.lproj
      - path: Resources/en.lproj
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lim.ios
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"

  LIMTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LIMTests
    dependencies:
      - target: LIM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.lim.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  LIM:
    build:
      targets:
        LIM: all
        LIMTests: [test]
    run:
      config: Debug
      # Local StoreKit testing — purchases work in the simulator with no
      # App Store Connect setup. (Requires XcodeGen ≥ 2.25; remove if unsupported
      # and select the config manually in Edit Scheme → Run → Options.)
      storeKitConfiguration: Products.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LIMTests
