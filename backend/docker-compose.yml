services:
  api:
    build: .
    image: lim-backend:latest
    container_name: lim-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      LIM_ADDR: ":8080"
      LIM_DATA_FILE: "/data/lim-data.json"
      # Change these for any non-local deployment.
      LIM_JWT_SECRET: "change-me-in-production"
      LIM_ADMIN_EMAIL: "admin@lim.app"
      LIM_ADMIN_PASSWORD: "admin123"
      LIM_CORS_ORIGIN: "*"
      LIM_SEED_DEMO: "true"
      # Serve the static admin web app from the bind-mount below, same origin.
      # Visit http://localhost:8080/admin/ (admin@lim.app / admin123).
      LIM_ADMIN_DIR: "/admin"
      # Persistence: defaults to the JSON file store in /data. To use Postgres
      # instead, uncomment the `db` service below and this line:
      # LIM_DATABASE_URL: "postgres://lim:lim@db:5432/lim?sslmode=disable"
      # Optional: enable the Claude-backed analysis engine.
      # ANTHROPIC_API_KEY: "sk-ant-..."
      # LIM_ANTHROPIC_MODEL: "claude-sonnet-4-6"
    volumes:
      - lim-data:/data
      # Admin web app (read-only). Path is relative to this compose file.
      - ../admin:/admin:ro
    healthcheck:
      test: ["CMD", "/app/lim-server", "-healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # depends_on:
    #   db:
    #     condition: service_healthy

  # Uncomment to run with Postgres instead of the JSON file store.
  # db:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: lim
  #     POSTGRES_PASSWORD: lim
  #     POSTGRES_DB: lim
  #   volumes:
  #     - lim-pg:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U lim"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10

volumes:
  lim-data:
  # lim-pg:
